[project]
name = "cluedo-engine"
version = "0.1.0"
description = "Motor de juego de AgentCluedo (agentes, GameManager), independiente de la consola y de cualquier backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Fijado a estas versiones exactas (no ">=0.3"): langchain 1.x reorganizó
    # AgentExecutor/create_tool_calling_agent fuera de langchain.agents y
    # rompe detective_agent.py. Mismas versiones que console/requirements.txt.
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-ollama==0.3.10",
    "langchain-openai==0.3.35",
    "pydantic>=2",
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cluedo_engine*"]

[tool.setuptools.package-data]
cluedo_engine = ["prompts/*.md"]
